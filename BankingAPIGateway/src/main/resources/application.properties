spring.application.name=BankingAPIGateway
server.port=9090

spring.cloud.gateway.mvc.routes[0].id=customer-service
spring.cloud.gateway.mvc.routes[0].uri=lb://BANKINGADMIN1
spring.cloud.gateway.mvc.routes[0].predicates[0]=Path=/customers/**

spring.cloud.gateway.mvc.routes[1].id=transaction-service
spring.cloud.gateway.mvc.routes[1].uri=lb://BANKINGUSER
spring.cloud.gateway.mvc.routes[1].predicates[0]=Path=/account/**

spring.cloud.gateway.mvc.routes[2].id=account-service
spring.cloud.gateway.mvc.routes[2].uri=lb://BANKINGADMIN2
spring.cloud.gateway.mvc.routes[2].predicates[0]=Path=/accounts/**

spring.cloud.gateway.mvc.routes[3].id=fd-service
spring.cloud.gateway.mvc.routes[3].uri=lb://BANKINGADMIN2
spring.cloud.gateway.mvc.routes[3].predicates[0]=Path=/fd/**

eureka.client.service-url.defaultZone=http://localhost:8761/eureka


